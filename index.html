<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="বাংলা প্রেম, রহস্য, সামাজিক ও অনুপ্রেরণামূলক গল্প পড়ুন।">
  <title>বাংলা গল্প | Love Story</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f8f7fc;
      color: #28243a;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      color: white;
      text-align: center;
      padding: 25px 16px;
    }

    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 5px 0 0; }

    main {
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }

    section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px #0000000c;
    }

    h2 { margin-top: 0; }

    #search {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .story {
      padding: 14px;
      margin: 12px 0;
      background: #f4efff;
      border-radius: 10px;
      border: 1px solid #eadfff;
    }

    .story h3 { margin: 0 0 5px; }
    .story p { margin: 0; color: #625878; }

    #status {
      padding: 10px;
      border-radius: 8px;
      background: #f8f7fc;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #777;
    }

    .empty {
      padding: 16px;
      text-align: center;
      color: #655a78;
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 বাংলা গল্প</h1>
    <p>আপনার পছন্দের গল্পের ঠিকানা</p>
  </header>

  <main>
    <section>
      <h2>গল্পের জগতে স্বাগতম!</h2>
      <p>
        প্রেম, রহস্য, সামাজিক ও অনুপ্রেরণামূলক গল্প পড়ুন।
        নতুন গল্পের জন্য আমাদের সঙ্গে থাকুন।
      </p>
    </section>

    <section>
      <h2>📖 সকল গল্প</h2>
      <input
        id="search"
        type="search"
        placeholder="গল্পের নাম খুঁজুন..."
        aria-label="গল্প খুঁজুন"
      >
      <p id="status">Firebase-এর সঙ্গে সংযোগ করা হচ্ছে...</p>
      <div id="stories"></div>
    </section>
  </main>

  <footer>© বাংলা গল্প</footer>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBlPLnL20HL5iypBFBilJe9wP02B6CnJNA",
      authDomain: "love-story-b32b6.firebaseapp.com",
      projectId: "love-story-b32b6",
      storageBucket: "love-story-b32b6.firebasestorage.app",
      messagingSenderId: "956090728711",
      appId: "1:956090728711:web:093d2deaff09ac3d2d45a2",
      measurementId: "G-ERDZRE71J0"
    };

    const statusElement = document.getElementById("status");
    const storiesElement = document.getElementById("stories");
    const searchElement = document.getElementById("search");

    let allStories = [];

    function renderStories() {
      const query = searchElement.value.trim().toLowerCase();

      const filtered = allStories.filter(story =>
        String(story.title || "").toLowerCase().includes(query)
      );

      storiesElement.replaceChildren();

      if (filtered.length === 0) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = query
          ? "এই নামে কোনো গল্প পাওয়া যায়নি।"
          : "এখনো কোনো গল্প যোগ করা হয়নি।";
        storiesElement.appendChild(message);
        return;
      }

      filtered.forEach(story => {
        const card = document.createElement("article");
        card.className = "story";

        const title = document.createElement("h3");
        title.textContent = story.title || "নামহীন গল্প";

        const description = document.createElement("p");
        description.textContent = story.description || "গল্পটি পড়তে সঙ্গে থাকুন।";

        card.append(title, description);
        storiesElement.appendChild(card);
      });
    }

    searchElement.addEventListener("input", renderStories);

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const snapshot = await getDocs(collection(db, "stories"));

      allStories = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));

      statusElement.textContent = "গল্পের তালিকা";
      renderStories();

    } catch (error) {
      console.error("Firebase error:", error);
      statusElement.textContent =
        "গল্প লোড করা যায়নি। Firebase সংযোগ ও Firestore Rules পরীক্ষা করতে হবে।";
      storiesElement.replaceChildren();
    }
  </script>
</body>
</html>
