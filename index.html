<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা গল্পের দুনিয়া</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-600 cursor-pointer" onclick="loadHome()">📖 বাংলা গল্প</h1>
            <div id="headerRight">
                <button onclick="openAdminLogin()" class="text-sm bg-gray-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-300">অ্যাডমিন প্যানেল</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto p-4 mb-16">
        <!-- Search Bar -->
        <div class="mb-4">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="গল্পের নাম বা কীওয়ার্ড দিয়ে খুঁজুন..." class="w-full p-3 bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <!-- Content Area -->
        <div id="contentArea">
            <div class="text-center py-10 text-gray-500">গল্প লোড হচ্ছে...</div>
        </div>
    </main>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBlPLnL20HL5iypBFBilJe9wP02B6CnJNA",
          authDomain: "love-story-b32b6.firebaseapp.com",
          projectId: "love-story-b32b6",
          storageBucket: "love-story-b32b6.firebasestorage.app",
          messagingSenderId: "956090728711",
          appId: "1:956090728711:web:093d2deaff09ac3d2d45a2",
          measurementId: "G-ERDZRE71J0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allStories = [];
        window.blockCount = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storyId = urlParams.get('story');
            const partId = urlParams.get('part');

            if (storyId && partId) {
                localStorage.setItem(`unlocked_${partId}`, 'true');
                await viewStory(storyId);
            } else {
                loadHome();
            }
        });

        window.loadHome = async function() {
            window.history.pushState({}, '', window.location.pathname);
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<h2 class="text-lg font-bold mb-3">সকল গল্প</h2><div id="storyList" class="space-y-3">লোড হচ্ছে...</div>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "stories"));
                allStories = [];
                let html = "";
                if(querySnapshot.empty) {
                    contentArea.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center"><p class="text-gray-500">এখনো কোনো গল্প যোগ করা হয়নি।</p></div>`;
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const story = { id: docSnap.id, ...docSnap.data() };
                    allStories.push(story);
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-md transition flex justify-between items-center" onclick="viewStory('${story.id}')">
                            <div>
                                <h3 class="font-bold text-lg text-red-600">${story.title || 'নামবিহীন গল্প'}</h3>
                                <p class="text-sm text-gray-600 mt-1">ক্যাটাগরি: ${story.category || 'সাধারণ'}</p>
                            </div>
                            <span class="text-sm text-red-500 font-semibold">পড়ুন &rarr;</span>
                        </div>
                    `;
                });
                document.getElementById('storyList').innerHTML = html;
            } catch (e) {
                console.error(e);
                contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">ডাটা লোড করতে সমস্যা হয়েছে: ${e.message}</div>`;
            }
        }

        window.handleSearch = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStories.filter(s => 
                (s.title && s.title.toLowerCase().includes(keyword)) || 
                (s.category && s.category.toLowerCase().includes(keyword))
            );
            const storyList = document.getElementById('storyList');
            if(!storyList) return;
            
            let html = "";
            if(filtered.length === 0) {
                storyList.innerHTML = `<p class="text-center text-gray-500 py-4">কোনো গল্প পাওয়া যায়নি</p>`;
                return;
            }
            filtered.forEach((story) => {
                html += `
                    <div class="bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-md transition flex justify-between items-center" onclick="viewStory('${story.id}')">
                        <div>
                            <h3 class="font-bold text-lg text-red-600">${story.title}</h3>
                            <p class="text-sm text-gray-600 mt-1">ক্যাটাগরি: ${story.category || 'সাধারণ'}</p>
                        </div>
                        <span class="text-sm text-red-500 font-semibold">পড়ুন &rarr;</span>
                    </div>
                `;
            });
            storyList.innerHTML = html;
        }

        window.viewStory = async function(storyId) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="text-center py-10">গল্প লোড হচ্ছে...</div>`;

            try {
                const storyDoc = await getDoc(doc(db, "stories", storyId));
                const storyData = storyDoc.data();

                const partsSnap = await getDocs(collection(db, "stories", storyId, "parts"));
                let parts = [];
                partsSnap.forEach(p => parts.push({ id: p.id, ...p.data() }));
                parts.sort((a, b) => a.partNumber - b.partNumber);

                if(parts.length === 0) {
                    contentArea.innerHTML = `
                        <button onclick="loadHome()" class="text-sm text-red-600 font-bold mb-3">&larr; সকল গল্পে ফিরে যান</button>
                        <div class="bg-white p-6 rounded-xl shadow text-center"><p class="text-gray-500">এই গল্পের এখনো কোনো পার্ট প্রকাশ করা হয়নি।</p></div>
                    `;
                    return;
                }

                let feedHtml = `
                    <button onclick="loadHome()" class="text-sm text-red-600 font-bold mb-3">&larr; সকল গল্পে ফিরে যান</button>
                    <div class="bg-white p-6 rounded-xl shadow mb-6">
                        <h2 class="text-2xl font-bold text-red-600 mb-1">${storyData.title}</h2>
                        <p class="text-sm text-gray-500">ক্যাটাগরি: ${storyData.category}</p>
                    </div>
                `;

                for(let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    const isUnlocked = (p.partNumber === 1 || localStorage.getItem(`unlocked_${p.id}`) === 'true');

                    feedHtml += `<div class="bg-white p-6 rounded-xl shadow mb-6 border border-gray-200">`;
                    feedHtml += `<div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h3 class="text-xl font-bold text-red-600">Part ${p.partNumber}: ${p.title || ''}</h3>
                        <button onclick="sharePartLink('${storyId}', '${p.id}')" class="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200">🔗 শেয়ার</button>
                    </div>`;

                    if(isUnlocked) {
                        let blocksHtml = "";
                        if(p.blocks && p.blocks.length > 0) {
                            p.blocks.forEach(b => {
                                if(b.type === 'text') {
                                    blocksHtml += `<div class="text-lg whitespace-pre-line text-gray-800 mb-4 leading-relaxed">${b.value}</div>`;
                                } else if(b.type === 'image') {
                                    blocksHtml += `
                                        <div class="my-4 flex flex-col md:flex-row gap-3 items-center">
                                            <div class="flex-grow w-full">
                                                <img src="${b.value}" class="w-full rounded-xl shadow border" alt="গল্পের ছবি">
                                            </div>
                                            <div class="w-full md:w-48 bg-gray-50 border border-dashed rounded-xl p-2 text-center text-xs text-gray-400 flex flex-col items-center justify-center min-h-[100px]">
                                                <span>📢 বিজ্ঞাপন</span>
                                            </div>
                                        </div>
                                    `;
                                }
                            });
                        } else if(p.content) {
                            blocksHtml = `<div class="text-lg whitespace-pre-line text-gray-800 mb-4 leading-relaxed">${p.content}</div>`;
                        }
                        feedHtml += `<div>${blocksHtml}</div>`;
                    } else {
                        feedHtml += `
                            <div class="text-center py-6 bg-gray-50 rounded-xl border border-dashed p-4">
                                <h4 class="text-lg font-bold text-red-600 mb-2">🔒 পরবর্তী পার্টটি লক করা আছে</h4>
                                <p class="text-sm text-gray-600 mb-4">এই পার্টটি পড়তে নিচের ৩টি বিজ্ঞাপনের ধাপ সম্পন্ন করুন:</p>
                                <div class="space-y-3 mb-4 max-w-md mx-auto">
                                    <button onclick="completeAdStep(1, '${storyId}', '${p.id}')" id="adBtn_${p.id}_1" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold text-sm">বিজ্ঞাপন ১ খুলুন</button>
                                    <button onclick="completeAdStep(2, '${storyId}', '${p.id}')" id="adBtn_${p.id}_2" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold text-sm opacity-50 cursor-not-allowed" disabled>বিজ্ঞাপন ২ খুলুন</button>
                                    <button onclick="completeAdStep(3, '${storyId}', '${p.id}')" id="adBtn_${p.id}_3" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold text-sm opacity-50 cursor-not-allowed" disabled>বিজ্ঞাপন ৩ খুলুন</button>
                                </div>
                                <button onclick="unlockPartFeed('${storyId}', '${p.id}')" id="unlockFinalBtn_${p.id}" class="w-full max-w-md bg-green-600 text-white p-3 rounded-lg font-bold text-sm opacity-50 cursor-not-allowed mx-auto block" disabled>পার্ট আনলক করুন</button>
                            </div>
                        `;
                        feedHtml += `</div>`;
                        break;
                    }

                    feedHtml += `</div>`;
                }

                contentArea.innerHTML = feedHtml;
            } catch(e) {
                contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">ত্রুটি: ${e.message}</div>`;
            }
        }

        window.sharePartLink = function(storyId, partId) {
            const shareUrl = `${window.location.origin}${window.location.pathname}?story=${storyId}&part=${partId}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('পার্টের ডাইরেক্ট লিংক কপি করা হয়েছে!');
            }).catch(err => {
                alert('লিংক কপি করতে সমস্যা হয়েছে: ' + err);
            });
        }

        window.completeAdStep = function(step, storyId, partId) {
            let adUrl = "";
            if(step === 1) adUrl = "https://uplcm.com/4/12022509";
            else if(step === 2) adUrl = "https://uplcm.com/4/12022506";
            else if(step === 3) adUrl = "https://uplcm.com/4/12022516";

            window.open(adUrl, '_blank');

            const btn = document.getElementById(`adBtn_${partId}_${step}`);
            btn.classList.add('bg-green-600');
            btn.innerText = `বিজ্ঞাপন ${step} সম্পন্ন হয়েছে ✓`;

            if(step === 1) {
                const next = document.getElementById(`adBtn_${partId}_2`);
                next.classList.remove('opacity-50', 'cursor-not-allowed');
                next.removeAttribute('disabled');
            } else if(step === 2) {
                const next = document.getElementById(`adBtn_${partId}_3`);
                next.classList.remove('opacity-50', 'cursor-not-allowed');
                next.removeAttribute('disabled');
            } else if(step === 3) {
                const finalBtn = document.getElementById(`unlockFinalBtn_${partId}`);
                finalBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                finalBtn.removeAttribute('disabled');
            }
        }

        window.unlockPartFeed = function(storyId, partId) {
            localStorage.setItem(`unlocked_${partId}`, 'true');
            viewStory(storyId);
        }

        window.openAdminLogin = function() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto">
                    <h2 class="text-xl font-bold mb-4 text-center text-red-600">অ্যাডমিন লগইন</h2>
                    <input type="email" id="adminEmail" placeholder="ইমেইল অ্যাড্রেস" class="w-full p-3 border rounded-lg mb-3">
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড" class="w-full p-3 border rounded-lg mb-4">
                    <button onclick="window.loginAdmin()" class="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700">লগইন করুন</button>
                </div>
            `;
        }

        window.loginAdmin = async function() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('সফলভাবে লগইন হয়েছে!');
                window.loadAdminDashboard();
            } catch (error) {
                alert('লগইন ব্যর্থ হয়েছে: ' + error.message);
            }
        }

        window.loadAdminDashboard = async function() {
            window.blockCount = 0;
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow mb-4">
                    <h2 class="text-xl font-bold mb-4 text-red-600">অ্যাডমিন ড্যাশবোর্ড</h2>
                    
                    <!-- Create Story -->
                    <div class="p-4 bg-gray-50 rounded-lg border mb-6">
                        <h3 class="font-bold mb-2">নতুন গল্প তৈরি করুন</h3>
                        <input type="text" id="storyTitle" placeholder="গল্পের নাম" class="w-full p-2 border rounded mb-2">
                        <input type="text" id="storyCategory" placeholder="ক্যাটাগরি" class="w-full p-2 border rounded mb-3">
                        <button onclick="window.addNewStory()" class="bg-red-600 text-white px-4 py-2 rounded font-bold">গল্প সংরক্ষণ করুন</button>
                    </div>

                    <!-- Manage / Edit Existing Parts Section -->
                    <div class="p-4 bg-gray-50 rounded-lg border mb-6">
                        <h3 class="font-bold mb-2 text-red-600">পোস্ট ম্যানেজ বা এডিট করুন</h3>
                        <select id="manageStorySelect" onchange="window.loadManageParts()" class="w-full p-2 border rounded mb-2">
                            <option value="">প্রথমে গল্প সিলেক্ট করুন</option>
                        </select>
                        <div id="managePartsList" class="space-y-2 mt-3"></div>
                    </div>

                    <!-- Add New Part -->
                    <div class="p-4 bg-gray-50 rounded-lg border">
                        <h3 class="font-bold mb-2">গল্পে নতুন পার্ট/পোস্ট যোগ করুন</h3>
                        <select id="selectStoryId" class="w-full p-2 border rounded mb-2">
                            <option value="">গল্প সিলেক্ট করুন</option>
                        </select>
                        <input type="number" id="partNumber" placeholder="পার্ট নম্বর (যেমন: 1, 2, 3)" class="w-full p-2 border rounded mb-2">
                        <input type="text" id="partTitle" placeholder="পার্টের শিরোনাম (ঐচ্ছিক)" class="w-full p-2 border rounded mb-4">

                        <div class="border-t pt-3 mb-3">
                            <h4 class="font-semibold text-sm mb-2 text-gray-700">গল্পের কনটেন্ট সাজান (লেখা ও ছবি):</h4>
                            <div id="blocksContainer" class="space-y-3 mb-3"></div>
                            
                            <div class="flex gap-2">
                                <button onclick="window.addTextBlock()" class="text-sm bg-blue-100 text-blue-700 px-3 py-2 rounded-lg font-bold">+ লেখা যোগ করুন</button>
                                <button onclick="window.addImageBlock()" class="text-sm bg-green-100 text-green-700 px-3 py-2 rounded-lg font-bold">+ ছবি যোগ করুন</button>
                            </div>
                        </div>

                        <button onclick="window.addNewPartWithBlocks()" class="w-full bg-red-600 text-white px-4 py-3 rounded-lg font-bold mt-4">সম্পূর্ণ পার্ট পোস্ট করুন</button>
                    </div>
                </div>
            `;

            try {
                const querySnapshot = await getDocs(collection(db, "stories"));
                const select1 = document.getElementById('selectStoryId');
                const select2 = document.getElementById('manageStorySelect');
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const opt = `<option value="${docSnap.id}">${data.title}</option>`;
                    select1.innerHTML += opt;
                    select2.innerHTML += opt;
                });
            } catch(e) { console.error(e); }

            window.addTextBlock();
        }

        window.loadManageParts = async function() {
            const storyId = document.getElementById('manageStorySelect').value;
            const container = document.getElementById('managePartsList');
            if(!storyId) { container.innerHTML = ""; return; }
            container.innerHTML = "লোড হচ্ছে...";

            try {
                const partsSnap = await getDocs(collection(db, "stories", storyId, "parts"));
                let parts = [];
                partsSnap.forEach(p => parts.push({ id: p.id, ...p.data() }));
                parts.sort((a, b) => a.partNumber - b.partNumber);

                if(parts.length === 0) {
                    container.innerHTML = `<p class="text-sm text-gray-500">এই গল্পে কোনো পার্ট নেই।</p>`;
                    return;
                }

                let html = "";
                parts.forEach(p => {
                    html += `
                        <div class="bg-white p-3 border rounded flex justify-between items-center text-sm">
                            <span>Part ${p.partNumber}: ${p.title || 'শিরোনামহীন'}</span>
                            <div class="flex gap-2">
                                <button onclick="window.editPart('${storyId}', '${p.id}')" class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs font-bold">এডিট</button>
                                <button onclick="window.deletePart('${storyId}', '${p.id}')" class="bg-red-600 text-white px-2.5 py-1 rounded text-xs font-bold">ডিলিট</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = `<p class="text-sm text-red-500">ত্রুটি: ${e.message}</p>`;
            }
        }

        window.deletePart = async function(storyId, partId) {
            if(confirm('আপনি কি নিশ্চিতভাবে এই পার্টটি ডিলিট করতে চান?')) {
                try {
                    await deleteDoc(doc(db, "stories", storyId, "parts", partId));
                    alert('পার্ট সফলভাবে ডিলিট করা হয়েছে!');
                    window.loadManageParts();
                } catch(e) {
                    alert('ডিলিট করতে সমস্যা হয়েছে: ' + e.message);
                }
            }
        }

        window.editPart = async function(storyId, partId) {
            try {
                const partDoc = await getDoc(doc(db, "stories", storyId, "parts", partId));
                const pData = partDoc.data();

                const contentArea = document.getElementById('contentArea');
                contentArea.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow mb-4">
                        <h2 class="text-xl font-bold mb-4 text-red-600">পার্ট এডিট করুন (Part ${pData.partNumber})</h2>
                        <input type="number" id="editPartNumber" value="${pData.partNumber}" placeholder="পার্ট নম্বর" class="w-full p-2 border rounded mb-2">
                        <input type="text" id="editPartTitle" value="${pData.title || ''}" placeholder="পার্টের শিরোনাম" class="w-full p-2 border rounded mb-4">

                        <div class="border-t pt-3 mb-3">
                            <h4 class="font-semibold text-sm mb-2 text-gray-700">কনটেন্ট ব্লকসমূহ (সংশোধন করুন):</h4>
                            <div id="editBlocksContainer" class="space-y-3 mb-3"></div>
                            <div class="flex gap-2">
                                <button onclick="window.addEditTextBlock()" class="text-sm bg-blue-100 text-blue-700 px-3 py-2 rounded-lg font-bold">+ লেখা যোগ করুন</button>
                                <button onclick="window.addEditImageBlock()" class="text-sm bg-green-100 text-green-700 px-3 py-2 rounded-lg font-bold">+ ছবি যোগ করুন</button>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-4">
                            <button onclick="window.updatePartData('${storyId}', '${partId}')" class="flex-grow bg-green-600 text-white px-4 py-3 rounded-lg font-bold">পরিবর্তন সেভ করুন</button>
                            <button onclick="window.loadAdminDashboard()" class="bg-gray-400 text-white px-4 py-3 rounded-lg font-bold">বাতিল</button>
                        </div>
                    </div>
                `;

                window.editBlockCounter = 0;
                const container = document.getElementById('editBlocksContainer');
                if(pData.blocks && pData.blocks.length > 0) {
                    pData.blocks.forEach(b => {
                        window.editBlockCounter++;
                        const div = document.createElement('div');
                        div.className = "p-3 bg-gray-50 border rounded-lg flex flex-col gap-2 relative edit-block-item";
                        div.dataset.type = b.type;
                        
                        if(b.type === 'text') {
                            div.innerHTML = `
                                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                                    <span>📝 টেক্সট ব্লক</span>
                                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                                </div>
                                <textarea class="edit-block-value w-full p-2 border rounded text-sm" rows="3">${b.value}</textarea>
                            `;
                        } else {
                            div.innerHTML = `
                                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                                    <span>🖼️ ছবি ব্লক</span>
                                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                                </div>
                                <input type="file" accept="image/*" onchange="handleEditImageUpload(event, '${window.editBlockCounter}')" class="w-full text-sm border p-2 rounded bg-white">
                                <input type="hidden" id="edit_img_val_${window.editBlockCounter}" class="edit-block-value" value="${b.value}">
                                <div id="edit_preview_${window.editBlockCounter}" class="mt-2">
                                    <img src="${b.value}" class="max-h-40 rounded shadow border mx-auto">
                                </div>
                            `;
                        }
                        container.appendChild(div);
                    });
                }
            } catch(e) {
                alert('এডিট ডাটা লোড করতে সমস্যা হয়েছে: ' + e.message);
            }
        }

        window.addEditTextBlock = function() {
            window.editBlockCounter++;
            const container = document.getElementById('editBlocksContainer');
            const div = document.createElement('div');
            div.className = "p-3 bg-gray-50 border rounded-lg flex flex-col gap-2 relative edit-block-item";
            div.dataset.type = "text";
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                    <span>📝 টেক্সট ব্লক</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                </div>
                <textarea class="edit-block-value w-full p-2 border rounded text-sm" rows="3" placeholder="লেখার অংশটি লিখুন..."></textarea>
            `;
            container.appendChild(div);
        }

        window.addEditImageBlock = function() {
            window.editBlockCounter++;
            const container = document.getElementById('editBlocksContainer');
            const div = document.createElement('div');
            div.className = "p-3 bg-gray-50 border rounded-lg flex flex-col gap-2 relative edit-block-item";
            div.dataset.type = "image";
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                    <span>🖼️ নতুন ছবি সিলেক্ট করুন</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                </div>
                <input type="file" accept="image/*" onchange="handleEditImageUpload(event, '${window.editBlockCounter}')" class="w-full text-sm border p-2 rounded bg-white">
                <input type="hidden" id="edit_img_val_${window.editBlockCounter}" class="edit-block-value" value="">
                <div id="edit_preview_${window.editBlockCounter}" class="hidden mt-2">
                    <img src="" class="max-h-40 rounded shadow border mx-auto">
                </div>
            `;
            container.appendChild(div);
        }

        window.handleEditImageUpload = function(event, blockId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 800;
                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById(`edit_img_val_${blockId}`).value = compressedDataUrl;
                        const previewDiv = document.getElementById(`edit_preview_${blockId}`);
                        previewDiv.querySelector('img').src = compressedDataUrl;
                        previewDiv.classList.remove('hidden');
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        window.updatePartData = async function(storyId, partId) {
            const partNumber = parseInt(document.getElementById('editPartNumber').value);
            const title = document.getElementById('editPartTitle').value;

            const blockElements = document.querySelectorAll('.edit-block-item');
            let blocks = [];
            blockElements.forEach(el => {
                const type = el.dataset.type;
                const value = el.querySelector('.edit-block-value').value;
                if(value.trim() !== '') {
                    blocks.push({ type, value });
                }
            });

            if(blocks.length === 0) {
                alert('কমপক্ষে একটি লেখা বা ছবি থাকা আবশ্যক!');
                return;
            }

            try {
                await updateDoc(doc(db, "stories", storyId, "parts", partId), {
                    partNumber,
                    title: title || '',
                    blocks: blocks
                });
                alert('পার্ট সফলভাবে আপডেট ও সংশোধন করা হয়েছে!');
                window.loadAdminDashboard();
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            }
        }

        window.addTextBlock = function() {
            window.blockCount++;
            const container = document.getElementById('blocksContainer');
            const div = document.createElement('div');
            div.className = "p-3 bg-white border rounded-lg flex flex-col gap-2 relative block-item";
            div.dataset.type = "text";
            div.id = `block_${window.blockCount}`;
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                    <span>📝 টেক্সট ব্লক</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                </div>
                <textarea class="block-value w-full p-2 border rounded text-sm" rows="3" placeholder="লেখার অংশটি লিখুন..."></textarea>
            `;
            container.appendChild(div);
        }

        window.addImageBlock = function() {
            window.blockCount++;
            const container = document.getElementById('blocksContainer');
            const div = document.createElement('div');
            div.className = "p-3 bg-white border rounded-lg flex flex-col gap-2 relative block-item";
            div.dataset.type = "image";
            div.id = `block_${window.blockCount}`;
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs font-semibold text-gray-500">
                    <span>🖼️ ছবি সিলেক্ট করুন (গ্যালারি থেকে)</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500">মুছে ফেলুন ✕</button>
                </div>
                <input type="file" accept="image/*" onchange="handleImageUpload(event, '${window.blockCount}')" class="w-full text-sm border p-2 rounded bg-gray-50">
                <input type="hidden" id="img_val_${window.blockCount}" class="block-value">
                <div id="status_${window.blockCount}" class="text-xs text-blue-600 font-semibold mt-1"></div>
                <div id="preview_${window.blockCount}" class="hidden mt-2">
                    <img src="" class="max-h-40 rounded shadow border mx-auto">
                </div>
            `;
            container.appendChild(div);
        }

        window.handleImageUpload = function(event, blockId) {
            const file = event.target.files[0];
            if (file) {
                const statusDiv = document.getElementById(`status_${blockId}`);
                statusDiv.innerText = "ছবি প্রসেস হচ্ছে, অপেক্ষা করুন...";
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 800;
                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById(`img_val_${blockId}`).value = compressedDataUrl;
                        statusDiv.innerText = "ছবি প্রস্তুত ✓";
                        
                        const previewDiv = document.getElementById(`preview_${blockId}`);
                        previewDiv.querySelector('img').src = compressedDataUrl;
                        previewDiv.classList.remove('hidden');
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        window.addNewStory = async function() {
            const title = document.getElementById('storyTitle').value;
            const category = document.getElementById('storyCategory').value;
            if(!title) { alert('গল্পের নাম দিন'); return; }
            try {
                await addDoc(collection(db, "stories"), { title, category: category || 'সাধারণ', createdAt: new Date() });
                alert('গল্প সফলভাবে যোগ করা হয়েছে!');
                window.loadAdminDashboard();
            } catch(e) { alert('ত্রুটি: ' + e.message); }
        }

        window.addNewPartWithBlocks = async function() {
            const storyId = document.getElementById('selectStoryId').value;
            const partNumber = parseInt(document.getElementById('partNumber').value);
            const title = document.getElementById('partTitle').value;

            if(!storyId || !partNumber) {
                alert('গল্প এবং পার্ট নম্বর নির্বাচন করা আবশ্যক!');
                return;
            }

            const blockElements = document.querySelectorAll('.block-item');
            let blocks = [];
            let imageProcessing = false;

            blockElements.forEach(el => {
                const type = el.dataset.type;
                const value = el.querySelector('.block-value').value;
                const fileInput = el.querySelector('input[type="file"]');
                
                if (fileInput && fileInput.files.length > 0 && !value) {
                    imageProcessing = true;
                }
                
                if (value.trim() !== '') {
                    blocks.push({ type, value });
                }
            });

            if (imageProcessing) {
                alert('ছবির প্রসেসিং শেষ হয়নি। কিছুক্ষণ অপেক্ষা করুন।');
                return;
            }

            if(blocks.length === 0) {
                alert('কমপক্ষে একটি লেখা বা ছবি সিলেক্ট করুন!');
                return;
            }

            try {
                await addDoc(collection(db, "stories", storyId, "parts"), {
                    partNumber,
                    title: title || '',
                    blocks: blocks,
                    createdAt: new Date()
                });
                alert('সফলভাবে পার্ট পোস্ট করা হয়েছে!');
                window.loadAdminDashboard();
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            }
        }
    </script>
