
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Story - বাংলা গল্প</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #34202a;
    }
    header {
      background: #c2185b;
      color: white;
      text-align: center;
      padding: 28px 12px;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 18px;
    }
    .welcome {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000010;
    }
    .story {
      background: white;
      padding: 18px;
      margin-top: 18px;
      border-radius: 12px;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #765966;
    }
  </style>
</head>
<body>
  <header>
    <h1>❤️ Love Story ❤️</h1>
    <p>তোমার প্রিয় বাংলা গল্পের ঠিকানা</p>
  </header>

  <main>
    <section class="welcome">
      <h2>গল্পের জগতে স্বাগতম!</h2>
      <p>এখানে তুমি রোমান্টিক গল্প ও ধারাবাহিকের পর্ব পড়তে পারবে।</p>
    </section>

    <section class="story">
      <h2>আমাদের গল্পের যাত্রা শুরু</h2>
      <p>নতুন গল্প খুব শিগগিরই এখানে প্রকাশিত হবে।</p>
    </section>
  </main>

  <footer>© Love Story</footer>
</body>
</html>
