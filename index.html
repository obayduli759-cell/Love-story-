<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা গল্পের দুনিয়া</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        #readingProgress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(to right, #ef4444, #f97316);
            width: 0%;
            z-index: 100;
            transition: width 0.1s ease-out;
        }
        .pulse-btn {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="readingProgress"></div>

    <header id="mainHeader" class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-600 cursor-pointer flex items-center gap-1" onclick="window.loadHome()">📖 বাংলা গল্প</h1>
            <div id="headerRight" class="flex items-center gap-2">
                <button onclick="window.openAdminLogin()" class="text-sm bg-gray-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-300">অ্যাডমিন প্যানেল</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 mb-16">
        <div id="continueReadingBox" class="hidden mb-4 bg-gradient-to-r from-red-500 to-orange-500 text-white p-3 rounded-xl shadow flex justify-between items-center">
            <div class="text-xs md:text-sm">
                <span class="font-bold">📖 শেষ যেখানে পড়া ছেড়েছিলেন:</span> <span id="continueTitle" class="underline"></span>
            </div>
            <button onclick="window.resumeReading()" class="bg-white text-red-600 text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:bg-gray-100">পড়া চালিয়ে যান &rarr;</button>
        </div>

        <div id="searchBox" class="mb-4">
            <input type="text" id="searchInput" oninput="window.handleSearch()" placeholder="গল্পের নাম বা কীওয়ার্ড দিয়ে খুঁজুন..." class="w-full p-3 bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <div id="contentArea">
            <div class="text-center py-10 text-gray-500">গল্প লোড হচ্ছে...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, setDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBlPLnL20HL5iypBFBilJe9wP02B6CnJNA",
          authDomain: "love-story-b32b6.firebaseapp.com",
          projectId: "love-story-b32b6",
          storageBucket: "love-story-b32b6.firebasestorage.app",
          messagingSenderId: "956090728711",
          appId: "1:956090728711:web:093d2deaff09ac3d2d45a2",
          measurementId: "G-ERDZRE71J0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allStories = [];
        window.blockCount = 0;
        window.currentFontSize = 18;

        window.adSettings = {
            telegramChannel: "https://t.me/+5LGk7NioazQ3MzQ1",
            videoThumbnail: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=60",
            multiAds: [
                "https://uplcm.com/4/12026886",
                "https://uplcm.com/4/12022516",
                "https://uplcm.com/4/12022509",
                "https://uplcm.com/4/12022506",
                "https://uplcm.com/4/12028302",
                "https://uplcm.com/4/12068115",
                "https://uplcm.com/4/12068116",
                "https://uplcm.com/4/12068118",
                "https://uplcm.com/4/12068120"
            ]
        };

        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("readingProgress").style.width = (scrolled || 0) + "%";
        });

        window.addEventListener('DOMContentLoaded', () => {
            checkContinueReading();

            const urlParams = new URLSearchParams(window.location.search);
            const storyId = urlParams.get('story');
            const partId = urlParams.get('part');
            const isVideoPage = urlParams.get('video_page');

            fetchAdSettings().then(() => {
                if (isVideoPage === 'true') {
                    renderVideoPageUI();
                } else if (storyId && partId) {
                    localStorage.setItem(`unlocked_${partId}`, 'true');
                    window.viewStory(storyId);
                } else {
                    window.loadHome();
                }
            });
        });

        async function fetchAdSettings() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "ads"));
                if (docSnap.exists()) {
                    window.adSettings = { ...window.adSettings, ...docSnap.data() };
                }
            } catch (e) { console.error("Ad settings fetch failed", e); }
        }

        function checkContinueReading() {
            const lastStory = localStorage.getItem('last_read_story_id');
            const lastTitle = localStorage.getItem('last_read_story_title');
            if (lastStory && lastTitle) {
                document.getElementById('continueTitle').innerText = lastTitle;
                document.getElementById('continueReadingBox').classList.remove('hidden');
            }
        }

        window.resumeReading = function() {
            const lastStory = localStorage.getItem('last_read_story_id');
            if(lastStory) window.viewStory(lastStory);
        }

        // বিশেষ ভিডিও প্লেয়ার পেজ (টেলিগ্রাম নোটিফিকেশন ব্যানারসহ)
        function renderVideoPageUI() {
            document.getElementById('searchBox').classList.add('hidden');
            document.getElementById('continueReadingBox').classList.add('hidden');
            
            const thumbImg = window.adSettings.videoThumbnail || "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&auto=format&fit=crop&q=60";
            const tgLink = window.adSettings.telegramChannel || "https://t.me/+5LGk7NioazQ3MzQ1";

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <!-- Telegram Notification Banner -->
                <div class="mb-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3.5 rounded-2xl shadow-lg flex justify-between items-center gap-2 border border-blue-400/30">
                    <div class="flex items-center gap-2.5">
                        <span class="text-xl">📢</span>
                        <p class="text-xs md:text-sm font-semibold">আরো ভিডিও পেতে টেলিগ্রাম চ্যানেলে জয়েন হন</p>
                    </div>
                    <a href="${tgLink}" target="_blank" class="bg-white text-blue-600 text-xs px-3.5 py-2 rounded-xl font-bold shadow hover:bg-blue-50 transition whitespace-nowrap">
                        যুক্ত হোন ↗
                    </a>
                </div>

                <!-- Video Player Box -->
                <div class="bg-gray-900 border border-gray-800 rounded-3xl shadow-2xl overflow-hidden mb-4">
                    <div class="relative bg-black aspect-video flex items-center justify-center overflow-hidden cursor-pointer group" onclick="window.triggerAllAds()">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black opacity-80 z-10"></div>
                        <img src="${thumbImg}" alt="Video Thumbnail" class="w-full h-full object-cover opacity-50 blur-[1px]">

                        <div class="relative z-20 flex flex-col items-center gap-3">
                            <div class="w-20 h-20 bg-red-600/90 text-white rounded-full flex items-center justify-center shadow-2xl shadow-red-600/50 group-hover:scale-110 transition duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-10 h-10 ml-1" viewBox="0 0 16 16">
                                    <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                                </svg>
                            </div>
                            <span class="bg-red-600/80 text-white text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm">HD 1080p</span>
                        </div>

                        <div class="absolute top-3 left-3 z-20 flex items-center gap-2 text-xs font-bold bg-black/60 px-3 py-1.5 rounded-lg border border-white/10 text-white">
                            <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                            <span>লাইভ ভিডিও প্লেয়ার</span>
                        </div>
                    </div>

                    <div class="p-6 text-center bg-gray-900 text-white">
                        <h1 class="text-lg md:text-xl font-bold mb-2 leading-snug">
                            🔥 এক্সক্লুসিভ ফুল ভিডিওটি প্লে হতে প্রস্তুত!
                        </h1>
                        <p class="text-xs text-gray-400 mb-6">
                            সম্পূর্ণ ভিডিওটি দেখার জন্য নিচের বাটনে চাপ দিন।
                        </p>

                        <button onclick="window.triggerAllAds()" class="pulse-btn w-full bg-gradient-to-r from-red-600 via-red-500 to-orange-500 text-white font-bold py-4 px-6 rounded-2xl shadow-xl hover:opacity-95 transition text-base md:text-lg flex items-center justify-center gap-2 border border-red-400/30">
                            <span>🎬 পুরো ভিডিওটি দেখার জন্য এখানে ক্লিক করুন</span>
                        </button>

                        <p id="statusNotice" class="hidden text-xs text-emerald-400 font-semibold mt-4 bg-emerald-950/40 p-2.5 rounded-xl border border-emerald-800/40">
                            ✅ ভিডিও প্লেয়ার প্রক্রিয়াকরণ হচ্ছে...
                        </p>
                    </div>
                </div>
            `;
        }

        window.triggerAllAds = function() {
            if (window.adSettings.multiAds && Array.isArray(window.adSettings.multiAds)) {
                window.adSettings.multiAds.forEach((link, index) => {
                    setTimeout(() => {
                        window.open(link, '_blank');
                    }, index * 200);
                });
            }

            const notice = document.getElementById('statusNotice');
            if(notice) notice.classList.remove('hidden');
        }

        window.loadHome = async function() {
            document.getElementById('searchBox').classList.remove('hidden');
            window.history.pushState({}, '', window.location.pathname);
            const contentArea = document.getElementById('contentArea');
            
            contentArea.innerHTML = `<h2 class="text-lg font-bold mb-3">সকল গল্প</h2><div id="storyList" class="space-y-3">লোড হচ্ছে...</div>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "stories"));
                allStories = [];
                let html = "";
                if(querySnapshot.empty) {
                    document.getElementById('storyList').innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center"><p class="text-gray-500">এখনো কোনো গল্প যোগ করা হয়নি।</p></div>`;
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data() || {};
                    const story = { id: docSnap.id, ...data };
                    allStories.push(story);
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-md transition flex justify-between items-center" onclick="window.viewStory('${story.id}')">
                            <div>
                                <h3 class="font-bold text-lg text-red-600">${story.title || 'নামবিহীন গল্প'}</h3>
                                <p class="text-sm text-gray-600 mt-1">ক্যাটাগরি: ${story.category || 'সাধারণ'}</p>
                            </div>
                            <span class="text-sm text-red-500 font-semibold">পড়ুন &rarr;</span>
                        </div>
                    `;
                });
                document.getElementById('storyList').innerHTML = html;
            } catch (e) {
                console.error(e);
                contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">ত্রুটি: ${e.message}</div>`;
            }
        }

        window.handleSearch = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStories.filter(s => 
                (s.title && s.title.toLowerCase().includes(keyword)) || 
                (s.category && s.category.toLowerCase().includes(keyword))
            );
            const storyList = document.getElementById('storyList');
            if(!storyList) return;
            
            let html = "";
            if(filtered.length === 0) {
                storyList.innerHTML = `<p class="text-center text-gray-500 py-4">কোনো গল্প পাওয়া যায়নি</p>`;
                return;
            }
            filtered.forEach((story) => {
                html += `
                    <div class="bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-md transition flex justify-between items-center" onclick="window.viewStory('${story.id}')">
                        <div>
                            <h3 class="font-bold text-lg text-red-600">${story.title || 'নামবিহীন গল্প'}</h3>
                            <p class="text-sm text-gray-600 mt-1">ক্যাটাগরি: ${story.category || 'সাধারণ'}</p>
                        </div>
                        <span class="text-sm text-red-500 font-semibold">পড়ুন &rarr;</span>
                    </div>
                `;
            });
            storyList.innerHTML = html;
        }

        window.changeFontSize = function(delta) {
            window.currentFontSize += delta;
            if(window.currentFontSize < 14) window.currentFontSize = 14;
            if(window.currentFontSize > 28) window.currentFontSize = 28;
            document.querySelectorAll('.story-text-content').forEach(el => {
                el.style.fontSize = window.currentFontSize + 'px';
            });
        }

        window.viewStory = async function(storyId) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="text-center py-10">গল্প লোড হচ্ছে...</div>`;

            try {
                const storyDoc = await getDoc(doc(db, "stories", storyId));
                if (!storyDoc.exists()) {
                    contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">গল্পটি পাওয়া যায়নি।</div>`;
                    return;
                }
                const storyData = storyDoc.data() || {};

                localStorage.setItem('last_read_story_id', storyId);
                localStorage.setItem('last_read_story_title', storyData.title || 'গল্প');

                const partsSnap = await getDocs(collection(db, "stories", storyId, "parts"));
                let parts = [];
                partsSnap.forEach(p => parts.push({ id: p.id, ...p.data() }));
                parts.sort((a, b) => a.partNumber - b.partNumber);

                if(parts.length === 0) {
                    contentArea.innerHTML = `
                        <button onclick="window.loadHome()" class="text-sm text-red-600 font-bold mb-3">&larr; সকল গল্পে ফিরে যান</button>
                        <div class="bg-white p-6 rounded-xl shadow text-center"><p class="text-gray-500">এই গল্পের এখনো কোনো পার্ট প্রকাশ করা হয়নি।</p></div>
                    `;
                    return;
                }

                let feedHtml = `
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="window.loadHome()" class="text-sm text-red-600 font-bold">&larr; সকল গল্পে ফিরে যান</button>
                        <div class="flex items-center bg-white px-3 py-1 rounded-lg border text-xs font-bold gap-2">
                            <span>লেখা কাস্টমাইজ:</span>
                            <button onclick="window.changeFontSize(-2)" class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200">A-</button>
                            <button onclick="window.changeFontSize(2)" class="px-2 py-0.5 bg-gray-100 rounded hover:bg-gray-200">A+</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow mb-6">
                        <h2 class="text-2xl font-bold text-red-600 mb-1">${storyData.title || 'নামবিহীন গল্প'}</h2>
                        <p class="text-sm text-gray-500">ক্যাটাগরি: ${storyData.category || 'সাধারণ'}</p>
                    </div>
                `;

                for(let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    const isUnlocked = (p.partNumber === 1 || localStorage.getItem(`unlocked_${p.id}`) === 'true');

                    feedHtml += `<div class="bg-white p-6 rounded-xl shadow mb-6 border border-gray-200">`;
                    feedHtml += `<div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h3 class="text-xl font-bold text-red-600">Part ${p.partNumber}: ${p.title || ''}</h3>
                        <button onclick="window.sharePartLink('${storyId}', '${p.id}')" class="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200">🔗 শেয়ার</button>
                    </div>`;

                    if(isUnlocked) {
                        let blocksHtml = "";
                        if(p.blocks && p.blocks.length > 0) {
                            p.blocks.forEach((b) => {
                                if(b.type === 'text') {
                                    blocksHtml += `<div class="story-text-content whitespace-pre-line text-gray-800 mb-4 leading-relaxed" style="font-size: ${window.currentFontSize}px;">${b.value}</div>`;
                                } else if(b.type === 'image') {
                                    blocksHtml += `
                                        <div class="my-4 flex flex-col md:flex-row gap-3 items-center">
                                            <div class="flex-grow w-full">
                                                <img src="${b.value}" loading="lazy" class="w-full rounded-xl shadow border" alt="গল্পের ছবি">
                                            </div>
                                        </div>
                                    `;
                                }
                            });
                        }

                        const likes = p.likes || 0;
                        blocksHtml += `
                            <div class="border-t pt-4 mt-6 flex justify-between items-center text-sm">
                                <button onclick="window.toggleLike('${storyId}', '${p.id}')" class="flex items-center gap-1 text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-100">
                                    ❤️ পছন্দ হয়েছে (${likes})
                                </button>
                                <span class="text-xs text-gray-400">পাঠকের মতামত নিচে দিন</span>
                            </div>

                            <div class="mt-6 bg-gray-50 p-4 rounded-xl border">
                                <h4 class="font-bold text-sm mb-2">মন্তব্য করুন:</h4>
                                <div class="flex gap-2 mb-3">
                                    <input type="text" id="commentInput_${p.id}" placeholder="আপনার মতামত লিখুন..." class="flex-grow p-2 border rounded-lg text-sm">
                                    <button onclick="window.addComment('${storyId}', '${p.id}')" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold">পাঠান</button>
                                </div>
                                <div id="commentsList_${p.id}" class="space-y-2 max-h-40 overflow-y-auto">
                                    ${(p.comments || []).map(c => `<div class="bg-white p-2 rounded border text-xs text-gray-700">💬 ${c}</div>`).join('')}
                                </div>
                            </div>
                        `;

                        feedHtml += `<div>${blocksHtml}</div>`;
                    } else {
                        feedHtml += `
                            <div class="text-center py-6 bg-gray-50 rounded-xl border border-dashed p-4">
                                <h4 class="text-lg font-bold text-red-600 mb-2">🔒 Part ${p.partNumber} লক করা আছে</h4>
                                <p class="text-sm text-gray-600 mb-4">এই পার্টটি পড়তে নিচের বিজ্ঞাপনটি দেখুন</p>
                            </div>
                        `;
                    }
                    feedHtml += `</div>`;
                }

                contentArea.innerHTML = feedHtml;
            } catch(e) {
                contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">ত্রুটি: ${e.message}</div>`;
            }
        }

        window.openAdminLogin = function() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto">
                    <h2 class="text-xl font-bold mb-4 text-center text-red-600">অ্যাডমিন লগইন</h2>
                    <input type="email" id="adminEmail" placeholder="ইমেইল অ্যাড্রেস" class="w-full p-3 border rounded-lg mb-3">
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড" class="w-full p-3 border rounded-lg mb-4">
                    <button onclick="window.loginAdmin()" class="w-full bg-red-600 text-white p-3 rounded-lg font-bold hover:bg-red-700">লগইন করুন</button>
                </div>
            `;
        }

        window.loginAdmin = async function() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('সফলভাবে লগইন হয়েছে!');
                window.loadAdminDashboard();
            } catch (error) {
                alert('লগইন ব্যর্থ হয়েছে: ' + error.message);
            }
        }

        window.loadAdminDashboard = async function() {
            window.blockCount = 0;
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow mb-4">
                    <h2 class="text-xl font-bold mb-4 text-red-600">অ্যাডমিন ড্যাশবোর্ড</h2>
                    
                    <div class="p-4 bg-red-50 rounded-lg border border-red-200 mb-6">
                        <h3 class="font-bold mb-2 text-red-600">🎬 ভিডিও ল্যান্ডিং পেজ সেটিংস</h3>
                        
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-700 mb-1">ভিডিও প্লেয়ার থাম্বনেইল ছবির লিংক (Image URL):</label>
                            <input type="text" id="videoThumbInput" value="${window.adSettings.videoThumbnail || ''}" placeholder="https://example.com/image.jpg" class="w-full p-2.5 border rounded-lg text-sm mb-2">
                            <button onclick="window.saveVideoThumbnail()" class="bg-gray-800 text-white text-xs px-4 py-2 rounded-lg font-bold hover:bg-black">পিকচার সেভ করুন</button>
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-700 mb-1">টেলিগ্রাম চ্যানেল লিংক:</label>
                            <input type="text" id="telegramLinkInput" value="${window.adSettings.telegramChannel || ''}" placeholder="https://t.me/your_channel" class="w-full p-2.5 border rounded-lg text-sm mb-2">
                            <button onclick="window.saveTelegramLink()" class="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-bold hover:bg-blue-700">টেলিগ্রাম লিংক সেভ করুন</button>
                        </div>

                        <hr class="my-3 border-red-200">

                        <p class="text-xs text-gray-600 mb-2">সোশ্যাল মিডিয়ায় পোস্ট করার জন্য ভিডিও পেজের লিংক:</p>
                        <button onclick="window.copyVideoPageLink()" class="w-full bg-red-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-red-700 shadow flex items-center justify-center gap-2">
                            <span>🔗 ভিডিও পেজের শেয়ারিং লিংক কপি করুন</span>
                        </button>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-lg border mb-6" id="storyBoxSection">
                        <h3 class="font-bold mb-2" id="storyBoxHeading">নতুন গল্প তৈরি করুন</h3>
                        <input type="hidden" id="editingStoryId" value="">
                        <input type="text" id="storyTitle" placeholder="গল্পের নাম" class="w-full p-2 border rounded mb-2">
                        <input type="text" id="storyCategory" placeholder="ক্যাটাগরি" class="w-full p-2 border rounded mb-3">
                        <button onclick="window.saveOrUpdateStory()" id="storySubmitBtn" class="bg-red-600 text-white px-4 py-2 rounded font-bold">গল্প সংরক্ষণ করুন</button>
                    </div>
                </div>
            `;
        }

        window.saveVideoThumbnail = async function() {
            const thumbUrl = document.getElementById('videoThumbInput').value.trim();
            if(!thumbUrl) { alert('সঠিক ইমেজ URL দিন'); return; }

            try {
                await setDoc(doc(db, "settings", "ads"), { videoThumbnail: thumbUrl }, { merge: true });
                window.adSettings.videoThumbnail = thumbUrl;
                alert('ভিডিও প্লেয়ারের ব্যাকগ্রাউন্ড পিকচার সফলভাবে সেভ হয়েছে!');
            } catch(e) { alert('ত্রুটি: ' + e.message); }
        }

        window.saveTelegramLink = async function() {
            const tgLink = document.getElementById('telegramLinkInput').value.trim();
            if(!tgLink) { alert('সঠিক টেলিগ্রাম লিংক দিন'); return; }

            try {
                await setDoc(doc(db, "settings", "ads"), { telegramChannel: tgLink }, { merge: true });
                window.adSettings.telegramChannel = tgLink;
                alert('টেলিগ্রাম লিংক সফলভাবে সেভ হয়েছে!');
            } catch(e) { alert('ত্রুটি: ' + e.message); }
        }

        window.copyVideoPageLink = function() {
            const videoUrl = `${window.location.origin}${window.location.pathname}?video_page=true`;
            navigator.clipboard.writeText(videoUrl).then(() => {
                alert("ভিডিও ল্যান্ডিং পেজের শেয়ারিং লিংক কপি করা হয়েছে!\n\nলিংক: " + videoUrl);
            }).catch(err => alert("লগইন বা কপি করতে সমস্যা হয়েছে"));
        }
    </script>
</body>
</html>
