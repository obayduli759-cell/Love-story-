
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা গল্পের দুনিয়া</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-600 cursor-pointer" onclick="loadHome()">📖 বাংলা গল্প</h1>
            <button onclick="openAdminLogin()" class="text-sm bg-gray-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-300">অ্যাডমিন প্যানেল</button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app" class="max-w-3xl mx-auto p-4 mb-16">
        <!-- Search Bar -->
        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="গল্পের নাম বা কীওয়ার্ড দিয়ে খুঁজুন..." class="w-full p-3 bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <!-- Dynamic Content Area -->
        <div id="contentArea">
            <div class="text-center py-10 text-gray-500">গল্প লোড হচ্ছে...</div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBlPLnL20HL5iypBFBilJe9wP02B6CnJNA",
          authDomain: "love-story-b32b6.firebaseapp.com",
          projectId: "love-story-b32b6",
          storageBucket: "love-story-b32b6.firebasestorage.app",
          messagingSenderId: "956090728711",
          appId: "1:956090728711:web:093d2deaff09ac3d2d45a2",
          measurementId: "G-ERDZRE71J0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Simple Home Page Renderer
        window.loadHome = async function() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<h2 class="text-lg font-bold mb-3">সকল গল্প</h2><div id="storyList" class="space-y-3">লোডিং...</div>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "stories"));
                let html = "";
                if(querySnapshot.empty) {
                    contentArea.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center"><p class="text-gray-500">এখনো কোনো গল্প যোগ করা হয়নি। অ্যাডমিন প্যানেল থেকে গল্প যোগ করুন।</p></div>`;
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const story = doc.data();
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow cursor-pointer hover:shadow-md transition" onclick="alert('গল্পের ডিটেইলস শীঘ্রই আসছে!')">
                            <h3 class="font-bold text-lg text-red-600">${story.title || 'নামবিহীন গল্প'}</h3>
                            <p class="text-sm text-gray-600 mt-1">${story.category || 'সাধারণ'}</p>
                        </div>
                    `;
                });
                document.getElementById('storyList').innerHTML = html;
            } catch (e) {
                console.error(e);
                contentArea.innerHTML = `<div class="bg-red-100 p-4 rounded text-red-600">ডাটা লোড করতে সমস্যা হয়েছে। ফায়ারবেস রুলস চেক করুন।</div>`;
            }
        }

        window.openAdminLogin = function() {
            alert('অ্যাডমিন লগইন ও ড্যাশবোর্ড পেজ তৈরি হচ্ছে...');
        }

        // Run home load on start
        loadHome();
    </script>
</body>
</html>
